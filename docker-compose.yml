# ComunicaMedellin - Grupo 3
# Modulo 1: Arquitecturas Avanzadas de Bases de Datos - ITM 2026
#
# Perfil por defecto: Kafka en modo KRaft (sin Zookeeper).
# Para el perfil de aprendizaje con Zookeeper: make up-zk
#
# Heaps recortados a proposito: esto es una demo, no produccion.

name: comunicamedellin

x-cassandra-common: &cassandra-common
  image: cassandra:4.1
  environment: &cassandra-env
    CASSANDRA_CLUSTER_NAME: comunicamedellin
    CASSANDRA_DC: medellin
    CASSANDRA_RACK: rack1
    CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    # Sec. 3.3 - heap minimo para demo local
    MAX_HEAP_SIZE: 512M
    HEAP_NEWSIZE: 128M
  healthcheck:
    test: ["CMD-SHELL", "nodetool info | grep -q 'Native Transport active: true' && nodetool netstats | grep -q 'Mode: NORMAL'"]
    interval: 15s
    timeout: 10s
    retries: 30
    start_period: 120s

services:
  # ---------------------------------------------------------------
  # CASSANDRA - cluster 3 nodos (Sec. 1.3 NoSQL AP, Sec. 3.3)
  # Almacena presencia (clave-valor) e historial (wide-column).
  # Es el motor donde se demuestra ONE vs QUORUM.
  # ---------------------------------------------------------------
  cassandra-1:
    <<: *cassandra-common
    container_name: cass1
    ports: ["9042:9042"]
    environment:
      <<: *cassandra-env
      CASSANDRA_SEEDS: cassandra-1
    volumes: [cass1-data:/var/lib/cassandra]

  cassandra-2:
    <<: *cassandra-common
    container_name: cass2
    ports: ["9043:9042"]
    environment:
      <<: *cassandra-env
      CASSANDRA_SEEDS: cassandra-1
    depends_on:
      cassandra-1: {condition: service_healthy}
    volumes: [cass2-data:/var/lib/cassandra]

  # Nodo en el datacenter de respaldo. Declarar un DC distinto es lo
  # que permite usar NetworkTopologyStrategy y los niveles LOCAL_*
  # (Sec. 3.3: la replicacion es consciente de la topologia fisica).
  cassandra-3:
    <<: *cassandra-common
    container_name: cass3
    ports: ["9044:9042"]
    environment:
      <<: *cassandra-env
      CASSANDRA_DC: miami
      CASSANDRA_SEEDS: cassandra-1
    depends_on:
      cassandra-2: {condition: service_healthy}
    volumes: [cass3-data:/var/lib/cassandra]

  # ---------------------------------------------------------------
  # KAFKA - modo KRaft, sin Zookeeper (Sec. 4.2 log distribuido)
  # Un broker con 3 particiones = sharding por zona (Sec. 3.3).
  # ---------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports: ["9092:9092", "29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNO://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNO://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNO:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms128M"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ---------------------------------------------------------------
  # CLICKHOUSE - OLAP columnar (Sec. 2.2, 2.4 caso Mercado Libre)
  # Ruta analitica: agregaciones que Cassandra no resuelve bien.
  # ---------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: clickhouse
    ports: ["8123:8123", "9000:9000"]
    environment:
      CLICKHOUSE_USER: demo
      CLICKHOUSE_PASSWORD: demo
      CLICKHOUSE_DB: comunica
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./infra/clickhouse:/docker-entrypoint-initdb.d:ro

volumes:
  cass1-data: {}
  cass2-data: {}
  cass3-data: {}
  ch-data: {}
