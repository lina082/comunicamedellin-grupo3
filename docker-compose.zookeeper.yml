# PERFIL DE APRENDIZAJE - Kafka coordinado por Zookeeper
#
# NOTA (para la exposicion):
#   Kafka 3.5 marco Zookeeper como deprecated y Kafka 4.0 lo elimino.
#   Este perfil existe para PODER VER como funciona un servicio de
#   coordinacion distribuida (Sec. 1.3: "ZooKeeper and etcd as
#   coordination services"), no porque sea lo recomendado hoy.
#
#   Comparar con el perfil KRaft del docker-compose.yml, donde el
#   consenso se resuelve dentro del propio broker via Raft.
#
# Uso:  make up-zk      luego:  make zk-shell

name: comunicamedellin-zk

services:
  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper
    ports: ["2181:2181"]
    environment:
      ZOO_MY_ID: "1"
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,srvr,stat,mntr"
      JVMFLAGS: "-Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  kafka-zk:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka-zk
    ports: ["9192:9192"]
    depends_on:
      zookeeper: {condition: service_healthy}
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9192
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9192
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms128M"
